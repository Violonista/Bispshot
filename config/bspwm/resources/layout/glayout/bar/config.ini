include-file = "$BSPWM_RUN/colors/bar"
include-file = "$BSPWM_RUN/layout/bar/modules.ini"
include-file = "$BSPWM_RUN/layout/bar/custom-modules.ini"

[bar/main]
monitor = ${env:MONITOR:}
monitor-fallback =
monitor-strict = false
monitor-exact = true

override-redirect = false

bottom = true
fixed-center = true

width = 90%
height = 34

offset-x = 5%
offset-y = 10px

background = ${color.surface}
foreground = ${color.on-surface}

radius = 4

border-bottom-size = 2
border-color = ${color.primary}

padding = 0
module-margin = 0

font-0 = "Fira Code Light:size=10;2"
font-1 = "Font Awesome 7 Free:size=10;3"
font-2 = "Symbols Nerd Font:size=10;2"
font-3 = "Fira Code Symbol:size=10;2"
font-4 = "Noto Sans Symbols:size=10;2"

modules-left = start-menu xworkspaces pulseaudio tray 
modules-center = clock
modules-right = cpu memory disk powermenu

separator =

dim-value = 1.0

wm-name = 

locale = 

enable-ipc = true

click-left = 
click-middle = 
click-right =

scroll-up =
scroll-down =

double-click-left =
double-click-middle =
double-click-right =

cursor-click = 
cursor-scroll = 

[global/wm]

margin-bottom = 4 
margin-top = 4

[settings]
screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
