;; Baseado em adi1090x/polybar-themes (GPL-3.0)

[global/wm]
margin-bottom = 10
margin-top = 0

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

include-file = "$BSPWM_CURRENT/colors/bar"
include-file = "$BSPWM_CURRENT/layout/bar/modules.ini"
include-file = "$BSPWM_CURRENT/layout/bar/custom-modules.ini"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[bar/main]
wm-restack = bspwm
wm-name =
monitor =
monitor-fallback =
monitor-strict = false
override-redirect = false
top = true
bottom = false
fixed-center = true
width = 98%
height = 34
offset-x = 1%
offset-y = 1%
background = ${color.surface}
foreground = ${color.on-surface}
radius-top = 0.0
radius-bottom = 0.0
line-size = 2
line-color = ${color.primary}
border-bottom-size = 2
border-bottom-color = ${color.primary}
padding = 0
module-margin-left = 2
module-margin-right = 2
font-0 = "Terminus:size=10;3"
font-1 = "waffle:size=10;3"
modules-left = launcher workspaces
modules-center = date mpd
modules-right = cpu memory filesystem alsa sysmenu
separator =
dim-value = 1.0
locale = 
tray-position = none
tray-detached = false
tray-maxsize = 16
tray-background = ${color.surface}
tray-offset-x = 0
tray-offset-y = 0
tray-padding = 0
tray-scale = 1.0
enable-ipc = true
click-left = 
click-middle = 
click-right =
scroll-up =
scroll-down =
double-click-left =
double-click-middle =
double-click-right =
cursor-click = 
cursor-scroll = 

[settings]
throttle-output = 5
throttle-output-for = 10
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
