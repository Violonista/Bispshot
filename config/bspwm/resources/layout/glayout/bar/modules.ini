[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = true
group-by-monitor = false

enable-click = true
enable-scroll = true

icon-default = ♟

format = <label-state>
format-padding = 2

label-monitor = %name%

label-active = %icon%
label-active-foreground = ${color.primary}
label-active-overline =

label-occupied = %icon%
label-occupied-foreground = ${color.secondary}

label-urgent = %icon%
label-urgent-foreground = ${color.error}

label-empty = %icon%

label-active-padding = 2
label-urgent-padding = 2
label-occupied-padding = 2
label-empty-padding = 2

[module/pulseaudio]
type = internal/pulseaudio

master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default

master-mixer = Master
speaker-mixer = Speaker
headphone-mixer = Headphone

interval = 5

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
format-muted-prefix = 

label-volume = %percentage%%
label-muted = 
label-muted-foreground = ${color.on-surface-variant}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-headphones-0 = 

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.surface-container}

tray-spacing = 2px
tray-padding = 0px
tray-size = 66%

tray-background = ${color.surface-container}
tray-foreground = ${color.on-surface-container}

[module/clock]
type = internal/date

interval = 1

time =  %H %M

date-alt = 󰸗 %A, %d %B %Y,
time-alt = 󰥔 %H %M %S

format = <label>
format-background = ${color.surface}
format-foreground = ${color.on-surface}

label = %date% %time%
label-font = 3
label-background = ${color.surface}
label-foreground = ${color.on-surface}

[module/cpu]
type = internal/cpu

interval = 1

format = <label>
format-prefix = 
format-padding = 1
label = " %percentage%%"

[module/memory]
type = internal/memory

interval = 1

format = <label>
format-prefix = 
format-padding = 2

label = " %gb_used%"

[module/disk]
type = internal/fs

mount-0 = /

interval = 30

fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = 󰋊

format-unmounted = <label-unmounted>
format-unmounted-prefix = 󱁌
format-margin = 2

label-mounted = " %used%"
label-unmounted = " %mountpoint%"
