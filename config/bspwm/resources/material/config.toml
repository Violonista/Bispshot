[config]

[templates.bar]
input_path = "${BSPWM_RES}/material/templates/bar"
output_path = "${BSPWM_RUN}/colors/bar"
post_hook = "polybar-start"

[templates.menu]
input_path = "${BSPWM_RES}/material/templates/menu"
output_path = "${BSPWM_RUN}/colors/menu"

[templates.dunst]
input_path = "${BSPWM_RES}/material/templates/dunst"
output_path = "${BSPWM_RUN}/dunst"
post_hook = "dunstctl reload"

[templates.bspwm]
input_path = "${BSPWM_RES}/material/templates/bspwm"
output_path = "${BSPWM_RUN}/colors/bspwm"
post_hook = "bash ${BSPWM_RUN}/colors/bspwm"
